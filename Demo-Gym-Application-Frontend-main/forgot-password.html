<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — GymFlow SaaS Platform</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Stylesheets -->
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: linear-gradient(135deg, var(--bg-body) 0%, var(--bg-surface-secondary) 100%);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-xl);
      padding: 2.5rem;
    }
  </style>
</head>
<body class="auth-page">

  <div class="auth-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <a href="index.html" class="brand-link" style="justify-content: center; margin-bottom: 0.75rem;">
        <div class="brand-icon"><i class="fa-solid fa-dumbbell"></i></div>
        <div class="brand-text">Gym<span>Flow</span></div>
      </a>
      <h2 style="font-size: 1.5rem; margin-bottom: 0.35rem;">Password Reset</h2>
      <p style="font-size: 0.875rem;">Enter your verified account email to receive reset instructions.</p>
    </div>

    <div id="reset-form-container">
      <form id="form-reset" onsubmit="handleReset(event)">
        <div class="form-group">
          <label class="form-label" for="reset-email">Email Address <span class="required">*</span></label>
          <div class="input-with-icon">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input type="email" id="reset-email" class="form-control" placeholder="name@domain.com" required value="marcus@ironpulse.com">
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 btn-lg mb-3">
          <i class="fa-solid fa-paper-plane"></i>
          <span>Send Password Reset Link</span>
        </button>

        <div style="text-align: center; font-size: 0.875rem;">
          <a href="login.html" class="font-semibold text-accent">
            <i class="fa-solid fa-arrow-left"></i> Back to Sign In
          </a>
        </div>
      </form>
    </div>

    <div id="reset-success-container" style="display: none; text-align: center;">
      <div class="empty-icon" style="background: var(--color-success-bg); color: var(--color-success); margin: 0 auto 1.25rem;">
        <i class="fa-solid fa-envelope-circle-check"></i>
      </div>
      <h3 style="font-size: 1.25rem; margin-bottom: 0.5rem;">Reset Link Sent!</h3>
      <p style="font-size: 0.875rem; color: var(--text-muted); margin-bottom: 1.5rem;">
        We have simulated sending a secure password reset link to <strong id="sent-email-target">your email</strong>. Please check your inbox (and spam folder).
      </p>
      <a href="login.html" class="btn btn-primary w-100">
        <i class="fa-solid fa-arrow-left"></i> Return to Sign In
      </a>
    </div>
  </div>

  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/storage.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/navigation.js"></script>
  <script>
    function handleReset(e) {
      e.preventDefault();
      const email = document.getElementById('reset-email').value;
      document.getElementById('sent-email-target').textContent = email;
      document.getElementById('reset-form-container').style.display = 'none';
      document.getElementById('reset-success-container').style.display = 'block';
      Toast.success('Password reset email simulated successfully.');
    }
  </script>
</body>
</html>
